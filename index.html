<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Love To Color</title>
    <meta name="description" content="Tap to fill: calm coloring by number or in your own colors." />
    <meta name="theme-color" content="#f4efe4" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="/shared/v1/kit.css" />
    <link rel="stylesheet" href="/shared/v1/settings.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Home (the launch page): pictures in progress, then every picture to start. No Play
         button: picking a picture is how you start. -->
    <main id="home" class="screen">
      <header class="home-head">
        <h1 class="rainbow" aria-label="Love To Color"><span aria-hidden="true"><span>L</span><span>o</span><span>v</span><span>e</span> <span>T</span><span>o</span> <span>C</span><span>o</span><span>l</span><span>o</span><span>r</span></span></h1>
      </header>
      <section id="keepSection" hidden>
        <h2>Keep coloring</h2>
        <div id="keepList" class="keep-list"></div>
      </section>
      <section>
        <h2>Start a new picture</h2>
        <div id="sectionTabs" class="sections" role="tablist"></div>
        <div id="groupChips" class="chips" role="tablist"></div>
        <div id="pictureGrid" class="picture-grid"></div>
      </section>
    </main>

    <!-- Setup: the way of coloring for the chosen picture -->
    <main id="setup" class="screen" hidden>
      <div class="setup-body">
        <div id="setupPreview" class="setup-preview"></div>
        <h1 id="setupName"></h1>
        <h2 id="detailTitle" hidden>How much detail?</h2>
        <div id="detailChoices" class="choices three" hidden></div>
        <h2>How would you like to color?</h2>
        <div id="modeChoices" class="choices"></div>
        <button type="button" class="button big" id="startColoring">Start coloring</button>
        <button type="button" class="text-button" id="startOver" hidden>Start this one over</button>
      </div>
    </main>

    <!-- Coloring -->
    <main id="coloring" class="screen coloring" hidden>
      <header class="bar">
        <div class="bar-title"><span id="colorName"></span><small id="colorProgress"></small></div>
        <button type="button" class="icon-button" id="undo" aria-label="Undo" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      </header>
      <div class="stage-wrap">
        <div id="stage" class="stage"></div>
        <div class="zoom-buttons">
          <button type="button" class="icon-button" id="savePhoto" aria-label="Save to Photos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg></button>
          <button type="button" class="icon-button" id="findCell" aria-label="Find a cell to color" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.4-4.4"/></svg></button>
          <button type="button" class="icon-button" id="zoomOut" aria-label="Zoom out"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
          <button type="button" class="icon-button" id="zoomFit" aria-label="Whole picture"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
          <button type="button" class="icon-button" id="zoomIn" aria-label="Zoom in"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        </div>
        <div id="preparing" class="preparing">Getting your picture ready…</div>
      </div>
      <footer class="palette-panel">
        <div id="setChips" class="chips small" hidden></div>
        <div id="colorLabel" class="color-label"></div>
        <div id="swatches" class="swatches"></div>
      </footer>
    </main>

    <!-- Make your own color -->
    <div id="wheelSheet" class="sheet" hidden>
      <div class="sheet-card">
        <header class="sheet-head"><h2>Make your own color</h2><button type="button" class="icon-button" data-close aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header>
        <div id="wheelHost"></div>
        <p class="soft">Or tap any crayon in the Crayons box, then <strong>★ Keep</strong> to add it here.</p>
      </div>
    </div>

    <!-- Finished -->
    <div id="doneSheet" class="sheet" hidden>
      <div class="sheet-card center">
        <h2>Beautiful!</h2>
        <div id="donePicture" class="done-picture"></div>
        <p class="soft">Your picture is saved in Keep coloring.</p>
        <button type="button" class="button" id="doneSave">Save to Photos</button>
        <button type="button" class="text-button" id="doneHome">Home</button>
        <button type="button" class="text-button" data-close>Keep looking</button>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
