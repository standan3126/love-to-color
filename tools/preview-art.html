<!doctype html>
<meta charset="utf-8">
<title>Art preview</title>
<body style="margin:0;background:#fff">
<div id="out" style="display:grid;grid-template-columns:repeat(4,230px);gap:6px"></div>
<script type="module">
// Development page: each prepared drawing as outlines, then finished at Easy, Cozy and
// Detailed, with cell counts. ?only=<id> for one; &merge=a,b,c to try other merge sizes.
import { buildCells } from '../js/engine.js'
import { MERGE } from '../js/pictures.js'
const q = new URLSearchParams(location.search)
const only = q.get('only')
const merge = q.get('merge') ? q.get('merge').split(',').map(Number) : MERGE
const art = await (await fetch('../art/art.json')).json()
const out = document.getElementById('out')
const report = []
const load = async (src, w, h) => { const im = new Image(); im.src = src; await im.decode(); const c = new OffscreenCanvas(w, h).getContext('2d', { willReadFrequently: true }); c.drawImage(im, 0, 0); return c.getImageData(0, 0, w, h) }
for (const a of art.filter((a) => !only || a.id === only)) {
  const lines = await load(`../art/${a.id}/lines.png`, a.width, a.height)
  const colors = await load(`../art/${a.id}/colors.png`, a.width, a.height)
  const raw = document.createElement('img'); raw.src = `../art/${a.id}/lines.png`; raw.style.cssText = 'width:230px;height:230px;object-fit:contain'
  const b0 = document.createElement('div'); b0.append(raw); b0.insertAdjacentHTML('beforeend', `<div style="font:11px sans-serif">${a.id}: ${a.palette.length - 1} colors</div>`); out.append(b0)
  for (const detail of [0, 1, 2]) {
    const t0 = performance.now()
    const cells = buildCells({ lines, colors, palette: a.palette, mergeBelow: merge[detail], blank: [a.palette.length - 1] })
    const ms = Math.round(performance.now() - t0)
    const img = new ImageData(a.width, a.height)
    const rgb = a.palette.map((h) => [1, 3, 5].map((o) => parseInt(h.slice(o, o + 2), 16)))
    for (let c = 0; c < cells.cellCount; c++) {
      const [r, g, b] = rgb[cells.target[c]]
      for (let i = cells.cellStart[c]; i < cells.cellStart[c + 1]; i++) {
        const p = cells.cellPixels[i], k = p * 4, al = cells.lineAlpha[p] / 255
        img.data[k] = r * (1 - al) + 43 * al; img.data[k + 1] = g * (1 - al) + 38 * al; img.data[k + 2] = b * (1 - al) + 34 * al; img.data[k + 3] = 255
      }
    }
    const v = document.createElement('canvas'); v.width = a.width; v.height = a.height; v.getContext('2d').putImageData(img, 0, 0)
    v.style.cssText = 'width:230px;height:230px;object-fit:contain'
    const box = document.createElement('div')
    const numbered = [...cells.target].filter((t) => t !== a.palette.length - 1).length
    box.append(v); box.insertAdjacentHTML('beforeend', `<div style="font:11px sans-serif">d${detail}: ${numbered} numbered, ${ms}ms</div>`)
    out.append(box)
    report.push({ id: a.id, detail, cells: cells.cellCount, numbered, colors: a.palette.length - 1, ms })
  }
}
window.report = report
document.title = 'done'
</script>
