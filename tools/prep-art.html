<!doctype html>
<meta charset="utf-8" />
<title>Prepare art</title>
<body>
<script type="module">
// Turns one drawing (SVG) into the two images the game colors from:
//   lines.png   dark outlines on white: the drawing's own dark lines, plus a line wherever one
//               color meets another (so flat-color drawings get outlines too)
//   colors.png  the drawing simplified to named crayon colors: the Color by Number answer key
// Run by tools/prep-art.mjs: open ?src=<svg>&max=<pixels>; the result is left in window.result.
import { CRAYONS } from '../js/crayons.js'

const params = new URLSearchParams(location.search)
const MAX = Number(params.get('max') || 1200)
const COLORS = Number(params.get('k') || 12) // how many colors to simplify to (before naming)
const INK = 70 // darker than this is the drawing's own outline

const img = new Image()
img.src = params.get('src')
await img.decode()
const scale = (MAX * 0.94) / Math.max(img.naturalWidth || 800, img.naturalHeight || 800)
const dw = Math.round((img.naturalWidth || 800) * scale)
const dh = Math.round((img.naturalHeight || 800) * scale)
const W = Math.round(dw / 0.94)
const H = Math.round(dh / 0.94)
const canvas = new OffscreenCanvas(W, H)
const ctx = canvas.getContext('2d', { willReadFrequently: true })
ctx.fillStyle = '#fff'
ctx.fillRect(0, 0, W, H)
ctx.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh)
const px = ctx.getImageData(0, 0, W, H).data
const n = W * H
const lum = (i) => 0.3 * px[i] + 0.59 * px[i + 1] + 0.11 * px[i + 2]

// 1. Simplify the colors (k-means on a fixed sample, so the result is the same every run).
const sample = []
for (let p = 0; p < n; p += 7) {
  const i = p * 4
  if (lum(i) < INK) continue
  if (px[i] > 240 && px[i + 1] > 240 && px[i + 2] > 240) continue
  sample.push([px[i], px[i + 1], px[i + 2]])
}
let centers = []
for (let k = 0; k < COLORS && sample.length; k++) centers.push(sample[Math.floor(((k + 0.5) * sample.length) / COLORS)])
for (let round = 0; round < 12 && centers.length; round++) {
  const sum = centers.map(() => [0, 0, 0, 0])
  for (const s of sample) {
    let best = 0
    let bd = Infinity
    centers.forEach((c, j) => {
      const d = (s[0] - c[0]) ** 2 + (s[1] - c[1]) ** 2 + (s[2] - c[2]) ** 2
      if (d < bd) (bd = d), (best = j)
    })
    sum[best][0] += s[0]
    sum[best][1] += s[1]
    sum[best][2] += s[2]
    sum[best][3]++
  }
  centers = sum.filter((s) => s[3]).map((s) => [s[0] / s[3], s[1] / s[3], s[2] / s[3]])
}

// 2. Name each simplified color after the nearest crayon; white stays white.
const crayons = CRAYONS.map((c) => ({ ...c, rgb: [1, 3, 5].map((o) => parseInt(c.hex.slice(o, o + 2), 16)) }))
const nearestCrayon = ([r, g, b]) => {
  let best = crayons[0]
  let bd = Infinity
  for (const c of crayons) {
    const d = 2 * (r - c.rgb[0]) ** 2 + 4 * (g - c.rgb[1]) ** 2 + 3 * (b - c.rgb[2]) ** 2
    if (d < bd) (bd = d), (best = c)
  }
  return best
}
const WHITE = '#ffffff'
const used = [...new Set(centers.map((c) => nearestCrayon(c).hex))].filter((h) => h !== WHITE)
used.push(WHITE) // white is always last: the background, which gets no number
const pal = used.map((hex) => crayons.find((c) => c.hex === hex))
let INK_CLASS = pal.length
const cls = new Uint8Array(n)
const cache = new Map()
for (let p = 0; p < n; p++) {
  const i = p * 4
  if (lum(i) < INK) {
    cls[p] = INK_CLASS
    continue
  }
  const key = (px[i] << 16) | (px[i + 1] << 8) | px[i + 2]
  let k = cache.get(key)
  if (k === undefined) {
    let bd = Infinity
    k = 0
    pal.forEach((c, j) => {
      const d = 2 * (px[i] - c.rgb[0]) ** 2 + 4 * (px[i + 1] - c.rgb[1]) ** 2 + 3 * (px[i + 2] - c.rgb[2]) ** 2
      if (d < bd) (bd = d), (k = j)
    })
    cache.set(key, k)
  }
  cls[p] = k
}

// 2b. Wide dark areas (a dark brown wing, a black stripe) are colors to fill, not outline: only
// dark strokes thinner than about 40 pixels stay outline.
{
  const WIDE = 20
  const d = new Float32Array(n)
  for (let p = 0; p < n; p++) d[p] = cls[p] === INK_CLASS ? 1e6 : 0
  for (let y = 0; y < H; y++)
    for (let x = 0; x < W; x++) {
      const p = y * W + x
      if (!d[p]) continue
      d[p] = Math.min(d[p], x ? d[p - 1] + 1 : 1, y ? d[p - W] + 1 : 1)
    }
  for (let y = H - 1; y >= 0; y--)
    for (let x = W - 1; x >= 0; x--) {
      const p = y * W + x
      if (!d[p]) continue
      d[p] = Math.min(d[p], x < W - 1 ? d[p + 1] + 1 : 1, y < H - 1 ? d[p + W] + 1 : 1)
    }
  // Grow the wide middles back out to the area's edge (an "opening"), then name their color.
  const wide = new Uint8Array(n)
  const reach = new Float32Array(n).fill(1e6)
  for (let p = 0; p < n; p++) if (d[p] > WIDE) reach[p] = 0
  for (let y = 0; y < H; y++)
    for (let x = 0; x < W; x++) {
      const p = y * W + x
      reach[p] = Math.min(reach[p], x ? reach[p - 1] + 1 : 1e6, y ? reach[p - W] + 1 : 1e6)
    }
  for (let y = H - 1; y >= 0; y--)
    for (let x = W - 1; x >= 0; x--) {
      const p = y * W + x
      reach[p] = Math.min(reach[p], x < W - 1 ? reach[p + 1] + 1 : 1e6, y < H - 1 ? reach[p + W] + 1 : 1e6)
      if (cls[p] === INK_CLASS && reach[p] <= WIDE) wide[p] = 1
    }
  const darkTotals = new Map()
  for (let p = 0; p < n; p++) {
    if (!wide[p]) continue
    const i = p * 4
    const c = nearestCrayon([px[i], px[i + 1], px[i + 2]])
    darkTotals.set(c.hex, (darkTotals.get(c.hex) || 0) + 1)
  }
  const oldWhite = pal.length - 1
  const oldInk = INK_CLASS
  for (const [hex, count] of darkTotals) {
    if (count > n * 0.0005 && !pal.some((c) => c.hex === hex)) pal.splice(pal.length - 1, 0, crayons.find((c) => c.hex === hex))
  }
  INK_CLASS = pal.length
  for (let p = 0; p < n; p++) {
    if (cls[p] === oldWhite) cls[p] = pal.length - 1
    else if (cls[p] === oldInk) cls[p] = INK_CLASS
  }
  for (let p = 0; p < n; p++) {
    if (!wide[p]) continue
    const i = p * 4
    const hex = nearestCrayon([px[i], px[i + 1], px[i + 2]]).hex
    let k = pal.findIndex((c) => c.hex === hex)
    if (k === -1) {
      // A dark color too small to get its own number: use the closest color already in use.
      let bd = Infinity
      pal.slice(0, -1).forEach((c, j) => {
        const dd = (px[i] - c.rgb[0]) ** 2 + (px[i + 1] - c.rgb[1]) ** 2 + (px[i + 2] - c.rgb[2]) ** 2
        if (dd < bd) (bd = dd), (k = j)
      })
    }
    cls[p] = k
  }
}
// 3. Smooth away the soft edges (a 3×3 majority vote, twice).
for (let pass = 0; pass < 2; pass++) {
  const prev = cls.slice()
  const votes = new Uint16Array(INK_CLASS + 1)
  for (let y = 1; y < H - 1; y++) {
    for (let x = 1; x < W - 1; x++) {
      votes.fill(0)
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) votes[prev[(y + dy) * W + x + dx]]++
      let best = prev[y * W + x]
      for (let j = 0; j <= INK_CLASS; j++) if (votes[j] > votes[best]) best = j
      cls[y * W + x] = best
    }
  }
}

// 4. Outlines: the drawing's ink, plus every place two colors meet (about 3 pixels wide).
const edge = new Uint8Array(n)
for (let p = 0; p < n; p++) {
  if (cls[p] === INK_CLASS) {
    edge[p] = 1
    continue
  }
  const x = p % W
  if ((x < W - 1 && cls[p + 1] !== cls[p] && cls[p + 1] !== INK_CLASS) || (p < n - W && cls[p + W] !== cls[p] && cls[p + W] !== INK_CLASS)) edge[p] = 1
}
const thick = edge.slice()
for (let p = 0; p < n; p++) {
  if (!edge[p] || cls[p] === INK_CLASS) continue
  const x = p % W
  if (x > 0) thick[p - 1] = 1
  if (p >= W) thick[p - W] = 1
  if (x < W - 1) thick[p + 1] = 1
}
// A one-pixel soft edge so the outlines look drawn rather than jagged.
const lines = new ImageData(W, H)
for (let y = 0; y < H; y++) {
  for (let x = 0; x < W; x++) {
    const p = y * W + x
    let v = thick[p] ? 1 : 0
    if (!v) {
      let around = 0
      if (x > 0 && thick[p - 1]) around++
      if (x < W - 1 && thick[p + 1]) around++
      if (y > 0 && thick[p - W]) around++
      if (y < H - 1 && thick[p + W]) around++
      v = around * 0.12
    }
    const g = Math.round(255 - v * (255 - 43))
    lines.data.set([g, Math.round(255 - v * (255 - 38)), Math.round(255 - v * (255 - 34)), 255], p * 4)
  }
}
const colors = new ImageData(W, H)
for (let p = 0; p < n; p++) {
  const c = cls[p] === INK_CLASS ? [43, 38, 34] : pal[cls[p]].rgb
  colors.data.set([c[0], c[1], c[2], 255], p * 4)
}

const toPng = async (data) => {
  const c = new OffscreenCanvas(W, H)
  c.getContext('2d').putImageData(data, 0, 0)
  const blob = await c.convertToBlob({ type: 'image/png' })
  return new Promise((resolve) => {
    const r = new FileReader()
    r.onload = () => resolve(r.result)
    r.readAsDataURL(blob)
  })
}
window.result = { width: W, height: H, palette: pal.map((c) => c.hex), names: pal.map((c) => c.name), lines: await toPng(lines), colors: await toPng(colors) }
document.title = 'done'
</script>
</body>
