<!doctype html>
<meta charset="utf-8">
<title>Pattern preview</title>
<body style="margin:0;background:#fff">
<div id="out" style="display:grid;grid-template-columns:repeat(3,300px);gap:6px"></div>
<script type="module">
// Development page: draws every pattern at each size, colored as Color by Number would finish
// it, with its cell count. Open ?only=<id> for one pattern.
import { PATTERNS, drawPattern, SIZE } from '../js/patterns.js'
import { buildCells } from '../js/engine.js'
const only = new URLSearchParams(location.search).get('only')
const out = document.getElementById('out')
const report = []
for (const p of PATTERNS.filter((p) => !only || p.id === only)) {
  for (const detail of [0, 1, 2]) {
    const mk = () => { const c = document.createElement('canvas'); c.width = c.height = SIZE; return c.getContext('2d', { willReadFrequently: true }) }
    const L = mk(), C = mk()
    const { palette, blank } = drawPattern(p, detail, L, C)
    const t0 = performance.now()
    const cells = buildCells({ lines: L.getImageData(0, 0, SIZE, SIZE), colors: C.getImageData(0, 0, SIZE, SIZE), palette, blank })
    const ms = Math.round(performance.now() - t0)
    // Finished picture: every cell in its target color, outlines on top.
    const img = new ImageData(SIZE, SIZE)
    const rgb = palette.map((h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)])
    for (let c = 0; c < cells.cellCount; c++) {
      const [r, g, b] = rgb[cells.target[c]]
      for (let i = cells.cellStart[c]; i < cells.cellStart[c + 1]; i++) {
        const q = cells.cellPixels[i] * 4
        const a = cells.lineAlpha[cells.cellPixels[i]] / 255
        img.data[q] = r * (1 - a) + 43 * a; img.data[q + 1] = g * (1 - a) + 38 * a; img.data[q + 2] = b * (1 - a) + 34 * a; img.data[q + 3] = 255
      }
    }
    const view = document.createElement('canvas'); view.width = view.height = SIZE
    view.getContext('2d').putImageData(img, 0, 0)
    view.style.width = view.style.height = '300px'
    const box = document.createElement('div')
    const numbered = [...cells.target].filter((t) => !cells.blank.has(t)).length
    box.innerHTML = `<div style="font:12px sans-serif">${p.id} d${detail}: ${cells.cellCount} cells (${numbered} numbered), ${palette.length - 1} colors, ${ms} ms</div>`
    box.prepend(view)
    out.append(box)
    report.push({ id: p.id, detail, cells: cells.cellCount, numbered, colors: palette.length - 1, ms })
  }
}
window.report = report
document.title = 'done'
</script>
